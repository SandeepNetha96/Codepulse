



<div class="container">
    <h1 class="mt-3">Edit Blog Post</h1>


    <form [formGroup]="editBlogPostFormGroup" class="mt-3" (ngSubmit)="onSubmit()" >

        <!-- Title -->
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" formControlName="title">
        </div>

        <!-- Short Description -->
        <div class="mb-3">
            <label class="form-label">Short Description</label>
            <input type="text" class="form-control" formControlName="shortDescription">
        </div>

        <!-- URL Handle -->
        <div class="mb-3">
            <label class="form-label">URL Handle (Slug)</label>
            <input type="text" class="form-control" formControlName="urlHandle">
        </div>

        <!-- Content -->
        <div class="mb-3">

            <div class="d-flex flex-row">
                <div class="col-6 p-2">
                    <label class="form-label">Content</label>
                    <textarea class="form-control" formControlName="content" rows="5"></textarea>
                </div>
                <div class="col-6 p-2" style="max-height: 350px; overflow-y: scroll;">
                    <markdown [data]="editBlogPostFormGroup.controls.content.getRawValue()"></markdown>
                </div>
            </div>

            <!-- <label class="form-label">Content</label>
            <textarea class="form-control" formControlName="content" rows="5"></textarea> -->
        </div>

        <!-- Featured Image Url -->
        <div class="mb-3">
            <label class="form-label">Featured Image URL:
                <button class="btn btn-light" type="button" (click)="openImageSelector()" >Select Images</button>
            </label>

            @if(editBlogPostFormGroup.controls.featuredImageUrl.getRawValue()){
                <div>
                    <img [src]="editBlogPostFormGroup.controls.featuredImageUrl.getRawValue()" alt="No Image Preview" 
                        class= "my-2" style="width:100px; margin-left: 1%;">
                </div>
            }
            <input type="text" class="form-control" formControlName="featuredImageUrl">
        </div>

        <!-- Author -->
        <div class="mb-3">
            <label class="form-label">Author Name</label>
            <input type="text" class="form-control" formControlName="author">
        </div>

        <!-- Published Date -->
        <div class="mb-3">
            <label class="form-label">Published Date</label>
            <input type="date" class="form-control" formControlName="publishedDate">
        </div>

        <!-- Is Visible -->
        <div class="mb-3">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="isVisible" formControlName="isVisible"/>
                <label for="isVisible" class="form-check-label">Is Visible?</label>

            </div>
            
        </div>

        <div class="mb-3">
            <label class="form-label">Categories</label>
            <select class="form-control" multiple formControlName="categories">
                @for(category of categoriesResponse(); track category.id){
                    <option [value]="category.id"> {{category.name}} </option>
                }
            </select>
        </div>

        <div class="mb-3 d-flex justify-content-end mt-3 gap-4 ">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-danger" (click)="onDelete()" >Delete</button>
        </div>
    </form>

</div>



    <app-image-selector></app-image-selector>
