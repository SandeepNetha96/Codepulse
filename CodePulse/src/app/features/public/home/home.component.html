<style>
        /* HTML: <div class="loader"></div> */
    .loader {
    display: inline-grid;
    padding: 5px;
    background: #fff;
    filter: blur(4px) contrast(12);
    }
    .loader:before {
    content: "";
    height: 40px;
    aspect-ratio: 3;
    --c: #0000 64%,#000 66% 98%,#0000 101%;
    background:
        radial-gradient(35% 146% at 50% 159%,var(--c)) 0 0,
        radial-gradient(35% 146% at 50% -59%,var(--c)) 100% 100%;
    background-size: calc(200%/3) 50%;
    background-repeat: repeat-x;
    animation: l11 .8s infinite linear;
    }
    @keyframes l11{
    to {background-position: -200% 0,-100% 100%}
    }

    
    @media (min-width: 616px) and (max-width: 872px) {
        [data-snc='pjY0uf'] {
            padding: 0px 20px 0px 0px;
            box-sizing: border-box;
            min-width: 440px;
            grid-auto-rows: calc((max(420px, 100vw - 20px)) / (136.2));
            grid-template-columns: repeat(3, 1fr);
            }
    }

    .test{
        padding: 0px 20px 0px 0px;
            box-sizing: border-box;
            min-width: 440px;
            grid-auto-rows: calc((max(420px, 100vw - 20px)) / (136.2));
            grid-template-columns: repeat(3, 1fr);
    }

    .cvP2Ce {
        contain: layout paint;
        overflow: hidden;
    }

    .srKDX {
        display: grid;
        justify-content: space-between;
        align-items: start;
        position: relative;
        width: 100%;
    }

    .kb0PBd {
    display: block;
    flex: 0 0 auto;
    }


    




</style>

<div class="container">
    <div class="my-5">
        @if(isLoading()){
            <div class="loader"></div>
        }
        @else {
            <div class="row">
                @for (blogPost of blogPostsResponse(); track blogPost.id) {
                    <div class="col col-md-4">

                        <div class="card mx-1 my-1">
                            <img [src]="blogPost.featuredImageUrl" alt="" class="card-img">
                            <div class="card-body d-flex flex-column">
                                <h2 class="card-title" >
                                    {{blogPost.title}}
                                </h2>
                                <p class="card-text">
                                    {{blogPost.shortDescription}}
                                </p>
    
                                <span class="d-flex align-items-end" style="flex:1">
                                    <a [routerLink]="['/blog', blogPost.urlHandle]" class="btn btn-primary">Read More</a>
                                </span>
                            </div>
                        </div>


                    </div>
                }
            </div>
        }
    </div>
</div>
